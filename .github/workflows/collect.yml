name: 일괄 계산 결과 모으기
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['batch/collect.txt']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 실행 번호 읽기
        id: run
        run: echo "id=$(head -n 1 batch/collect.txt | tr -dc '0-9')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: 사이트 폴더로 옮기고 올리기
        run: |
          mkdir -p site/batch
          ls parts | head
          node batch/collect.js parts site/batch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/batch
          git diff --cached --quiet || git commit -m "일괄 계산 결과 갱신"
          git push origin HEAD:main
